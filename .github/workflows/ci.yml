name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Ubuntu's restic is too old for --insecure-no-password (needs 0.17+).
      - name: Install restic
        run: |
          curl -sSfL https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 \
            | bunzip2 > "$RUNNER_TEMP/restic"
          sudo install -m 755 "$RUNNER_TEMP/restic" /usr/local/bin/restic
          restic version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Scale test on the small synthetic repo (PLAN.md §4.8)
        run: |
          tests/fixtures/make_big_repo.sh small "$RUNNER_TEMP/big/small"
          RESTORIC_SCALE_REPO="$RUNNER_TEMP/big/small" cargo test --release --test scale -- --nocapture
